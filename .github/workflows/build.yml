name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, whole history)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose
          rm -f gl.tgz gitleaks
      - name: Static security checks
        run: bash scripts/checks.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: 8.7
      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Tests and build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testBasicDebugUnitTest :app:assembleBasicRelease :app:assembleFastRelease
      - name: Verify APKs (signature, permissions, dependencies)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/basic/release/app-basic-release.apk out/deckmate-shot.apk
          cp app/build/outputs/apk/fast/release/app-fast-release.apk out/deckmate-shot-fast.apk
          for f in out/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verifies|Number of signers|SHA-256 digest" | head -4
            "$BT/aapt2" dump permissions "$f" | sed -n "s/^uses-permission: name='\(.*\)'.*/\1/p" | sort > perms.txt
            diff perms.txt scripts/perms_expected.txt && echo "PASS permissions match ($(wc -l < perms.txt))"
          done
          gradle --no-daemon -q :app:dependencies --configuration basicReleaseRuntimeClasspath | tee out/dependencies.txt | head -30
          (cd out && sha256sum *.apk > SHA256.txt && cat SHA256.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-files
          path: out/
  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-files
          path: out
      - name: Pre-release (owner publishes later)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          NOTES="Версия 1.0.${{ github.run_number }}. Предварительная сборка для проверки. Контрольные суммы SHA-256 файлов:
          $(cat SHA256.txt)"
          gh release create "v1.0.${{ github.run_number }}-rc" deckmate-shot.apk deckmate-shot-fast.apk SHA256.txt --prerelease --title "DeckMate Скриншот 1.0.${{ github.run_number }} (проверка)" --notes "$NOTES"
