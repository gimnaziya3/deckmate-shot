name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_latest:
        description: "Сделать выпуск основным (Latest): true только по решению владельца"
        default: "false"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.7
      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Test and build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testBasicDebugUnitTest :app:assembleBasicRelease :app:assembleFastRelease
      - name: Verify APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/basic/release/app-basic-release.apk out/deckmate-shot.apk
          cp app/build/outputs/apk/fast/release/app-fast-release.apk out/deckmate-shot-fast.apk
          for f in out/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verifies|Number of signers|certificate SHA-256" | head -3
            "$BT/aapt2" dump permissions "$f" | sed -n "s/^uses-permission: name='\(.*\)'.*/\1/p" | sort | tee "$f.perms"
          done
          (cd out && sha256sum *.apk > SHA256.txt && cat SHA256.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: out/
  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: out
      - name: Publish (pre-release unless make_latest is true)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAKE_LATEST: ${{ github.event.inputs.make_latest }}
        run: |
          cd out
          N=${{ github.run_number }}
          NOTES="SHA-256:
          $(cat SHA256.txt)"
          if [ "$MAKE_LATEST" = "true" ]; then
            gh release create "v1.0.$N" deckmate-shot.apk deckmate-shot-fast.apk SHA256.txt --title "DeckMate Shot 1.0.$N" --notes "$NOTES" --latest
          else
            gh release create "v1.0.$N-rc" deckmate-shot.apk deckmate-shot-fast.apk SHA256.txt --title "DeckMate Shot 1.0.$N (pre-release)" --notes "$NOTES" --prerelease --latest=false
          fi
